name = "vatradar-watcher"
main = "src/index.js"
compatibility_date = "2026-07-01"

# 1분마다 실행. Cloudflare 무료 플랜도 크론 트리거를 지원합니다.
[triggers]
crons = ["* * * * *"]

# "직전에 누가 접속해 있었는지"를 기억하는 곳.
# wrangler d1 create vatradar-state 를 실행한 뒤 출력된 database_id를 여기에 넣으세요.
[[d1_databases]]
binding = "DB"
database_name = "vatradar-state"
database_id = "PUT_YOUR_D1_DATABASE_ID_HERE"
